<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP - Калькулятор объемных букв</title>
    <!-- Vue стили (включают layout через @import для правильной работы CSS Layers) -->
    <link rel="stylesheet" href="/src/main.css">
</head>
<body>
    <div id="app">
        <app-header></app-header>
        <main class="main-page bg-[#F6F6F6]">
            <div class="pt-32 mb-12">
                <div class="container">
                    <product-calculator></product-calculator>
                </div>
            </div>
            <technology-advantages></technology-advantages>
            <faq></faq>
            <seo-block></seo-block>
            <installation-cases></installation-cases>
            <feedback></feedback>
        </main>
        <app-footer></app-footer>
        <popup-menu></popup-menu>
    </div>

    <!-- Скрипты из layout (через public для dev и production) -->
    <script src="/layout/js/libs.min.js"></script>
    <script src="/layout/js/app.min.js"></script>

    <!-- Vue скрипты -->
    <script type="module">
        import { createApp } from 'vue';
        import Header from '@/entities/product/ui/Header.vue';
        import TechnologyAdvantages from '@/entities/product/ui/TechnologyAdvantages.vue';
        import Faq from '@/entities/product/ui/Faq.vue';
        import SeoBlock from '@/entities/product/ui/SeoBlock.vue';
        import InstallationCases from '@/entities/product/ui/InstallationCases.vue';
        import Feedback from '@/entities/product/ui/Feedback.vue';
        import Footer from '@/entities/product/ui/Footer.vue';
        import PopupMenu from '@/entities/product/ui/PopupMenu.vue';
        import ProductCalculator from '@/widgets/product/ProductCalculator.vue';

        const app = createApp({
            components: {
                AppHeader: Header,
                TechnologyAdvantages,
                Faq,
                SeoBlock,
                InstallationCases,
                Feedback,
                AppFooter: Footer,
                PopupMenu,
                ProductCalculator
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
