<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP Cart API Tests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .stat {
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-value.passed { color: #28a745; }
        .stat-value.failed { color: #dc3545; }
        .stat-value.total { color: #007bff; }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        .suite-header {
            background: #f8f9fa;
            padding: 15px 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .suite-header:hover {
            background: #e9ecef;
        }
        .suite-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: #28a745;
            color: white;
        }
        .suite-status.failed {
            background: #dc3545;
        }
        .test-list {
            padding: 0;
        }
        .test-case {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .test-icon {
            font-size: 20px;
            line-height: 1;
        }
        .test-icon.passed { color: #28a745; }
        .test-icon.failed { color: #dc3545; }
        .test-icon.running { color: #ffc107; }
        .test-content {
            flex: 1;
        }
        .test-name {
            font-weight: 500;
            margin-bottom: 5px;
        }
        .test-duration {
            font-size: 12px;
            color: #999;
        }
        .test-error {
            margin-top: 10px;
            padding: 10px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 4px;
            color: #c53030;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .run-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .run-button:hover {
            background: #0056b3;
        }
        .run-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            margin-bottom: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #007bff;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PSP Cart API Tests</h1>
        <p class="subtitle">TDD Browser Test Runner</p>

        <button id="runBtn" class="run-button">▶ Запустить тесты</button>

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div id="totalTests" class="stat-value total">0</div>
                <div class="stat-label">Всего тестов</div>
            </div>
            <div class="stat">
                <div id="passedTests" class="stat-value passed">0</div>
                <div class="stat-label">Успешных</div>
            </div>
            <div class="stat">
                <div id="failedTests" class="stat-value failed">0</div>
                <div class="stat-label">Провален</div>
            </div>
        </div>

        <div id="testResults"></div>
    </div>

    <script src="cart-api-tests.js"></script>
    <script>
        // Test runner UI controller
        const TestRunner = {
            stats: { total: 0, passed: 0, failed: 0 },
            currentTest: 0,

            updateStats() {
                document.getElementById('totalTests').textContent = this.stats.total;
                document.getElementById('passedTests').textContent = this.stats.passed;
                document.getElementById('failedTests').textContent = this.stats.failed;
                const progress = this.stats.total > 0 ? (this.currentTest / this.stats.total * 100) : 0;
                document.getElementById('progressFill').style.width = progress + '%';
            },

            createSuite(name) {
                const suite = document.createElement('div');
                suite.className = 'test-suite';
                suite.innerHTML = `
                    <div class="suite-header">
                        <span>${name}</span>
                        <span class="suite-status">0 / 0</span>
                    </div>
                    <div class="test-list"></div>
                `;
                document.getElementById('testResults').appendChild(suite);
                return suite;
            },

            addTest(suite, name) {
                const testCase = document.createElement('div');
                testCase.className = 'test-case';
                testCase.innerHTML = `
                    <div class="test-icon running">⏱</div>
                    <div class="test-content">
                        <div class="test-name">${name}</div>
                        <div class="test-duration">Выполняется...</div>
                    </div>
                `;
                suite.querySelector('.test-list').appendChild(testCase);
                return testCase;
            },

            passTest(testCase, duration) {
                testCase.querySelector('.test-icon').textContent = '✓';
                testCase.querySelector('.test-icon').className = 'test-icon passed';
                testCase.querySelector('.test-duration').textContent = `${duration}ms`;
                this.stats.passed++;
                this.currentTest++;
                this.updateStats();
            },

            failTest(testCase, error, duration) {
                testCase.querySelector('.test-icon').textContent = '✗';
                testCase.querySelector('.test-icon').className = 'test-icon failed';
                testCase.querySelector('.test-duration').textContent = `${duration}ms`;

                const errorDiv = document.createElement('div');
                errorDiv.className = 'test-error';
                errorDiv.textContent = error;
                testCase.querySelector('.test-content').appendChild(errorDiv);

                this.stats.failed++;
                this.currentTest++;
                this.updateStats();
            },

            updateSuiteStatus(suite) {
                const tests = suite.querySelectorAll('.test-case');
                const passed = suite.querySelectorAll('.test-icon.passed').length;
                const failed = suite.querySelectorAll('.test-icon.failed').length;
                const total = tests.length;

                const statusEl = suite.querySelector('.suite-status');
                statusEl.textContent = `${passed} / ${total}`;
                statusEl.className = 'suite-status ' + (failed > 0 ? 'failed' : '');
            }
        };

        // Run tests on button click
        document.getElementById('runBtn').addEventListener('click', async () => {
            document.getElementById('runBtn').disabled = true;
            document.getElementById('testResults').innerHTML = '';
            TestRunner.stats = { total: 0, passed: 0, failed: 0 };
            TestRunner.currentTest = 0;
            TestRunner.updateStats();

            try {
                await runAllTests(TestRunner);
            } catch (error) {
                console.error('Test runner error:', error);
            }

            document.getElementById('runBtn').disabled = false;
        });
    </script>
</body>
</html>
